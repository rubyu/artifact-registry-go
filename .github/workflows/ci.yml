name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTIFACT_REGISTRY_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/artifact_registry?sslmode=disable
      ARTIFACT_REGISTRY_TEST_S3_ENDPOINT: 127.0.0.1:9000
      ARTIFACT_REGISTRY_TEST_MIGRATOR_PASSWORD: artifact-registry-migrator-test-only
      ARTIFACT_REGISTRY_TEST_RUNTIME_PASSWORD: artifact-registry-runtime-test-only
      ARTIFACT_REGISTRY_TEST_MAINTENANCE_PASSWORD: artifact-registry-maintenance-test-only
      ARTIFACT_REGISTRY_TEST_READINESS_PASSWORD: artifact-registry-readiness-test-only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: 書式と依存の確認
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
      - name: PostgreSQL と object storage の起動
        run: docker compose -f docker/compose.yaml up -d --wait
      - name: 単体・統合・互換性テスト
        run: go test -race -count=1 -timeout=10m -coverprofile=coverage.out ./...
      - name: CLI のビルド
        run: go build ./cmd/...
      - name: リリース成果物と埋め込み情報の検証
        run: |
          set -euo pipefail
          mkdir -p dist
          go run ./tools/release > dist/version.json
          export VERSION=$(jq -r .version dist/version.json)
          export COMMIT=$(jq -r .commit dist/version.json)
          export DATE=$(jq -r .date dist/version.json)
          bash tools/release/package.sh
          (cd dist && sha256sum -c checksums.txt)
          mkdir -p "$RUNNER_TEMP/release-check"
          tar -xzf "dist/artifact-registry_${VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP/release-check"
          for command in artifact-registry-migrate artifact-registry-maintenance; do
            "$RUNNER_TEMP/release-check/$command" --version | jq -e --arg version "$VERSION" --arg commit "$COMMIT" --arg date "$DATE" '.version == $version and .commit == $commit and .date == $date'
          done
      - name: サービスログ
        if: failure()
        run: docker compose -f docker/compose.yaml logs
      - name: 検証環境の終了
        if: always()
        run: docker compose -f docker/compose.yaml down -v
