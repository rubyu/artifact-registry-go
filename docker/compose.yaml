services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: artifact_registry
    ports:
      - "5432:5432"
    volumes:
      - ./init-roles.sql:/docker-entrypoint-initdb.d/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d artifact_registry"]
      interval: 2s
      timeout: 5s
      retries: 30
  objectstore:
    image: docker.io/pgsty/silo:RELEASE.2026-09-03T13-18-01Z@sha256:b616a0cf8cb281e7e6bb3c9b1fb53875b4016a2878223925541c18f82d6c5ca3
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "/usr/bin/silo", "healthcheck", "ready"]
      interval: 2s
      timeout: 5s
      retries: 30
